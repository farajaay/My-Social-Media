<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal — one pulse across every channel</title>
<meta name="description" content="A live aggregate read on your social channels, refreshed on demand." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171310'/%3E%3Cpath d='M4 18h5l3-9 5 15 3-10h8' fill='none' stroke='%23ff8a3d' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Reusable brand marks: bare line marks, one house style, no container tiles. -->
<svg class="icon-sprite" aria-hidden="true">
  <symbol id="icon-pulse" viewBox="0 0 32 32">
    <path d="M2 18h6l3-11 6 18 3-13 3 6h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24">
    <path d="M4.5 4.5l15 15M19.5 4.5l-15 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-youtube" viewBox="0 0 24 24">
    <rect x="2.5" y="5.5" width="19" height="13" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M10.3 9.3v5.4l4.9-2.7z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-instagram" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="17.1" cy="6.9" r="1.1" fill="currentColor"/>
  </symbol>
  <symbol id="icon-tiktok" viewBox="0 0 24 24">
    <path d="M14 3.5c.6 2.3 2.1 3.7 4.5 4v2.6c-1.7 0-3.2-.5-4.5-1.5v6.4a5.3 5.3 0 1 1-5.3-5.3c.3 0 .6 0 .9.07v2.7a2.6 2.6 0 1 0 1.8 2.5V3.5z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-facebook" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.3" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M13.8 21v-7.2h2.3l.4-2.8h-2.7V9.2c0-.8.2-1.4 1.4-1.4h1.5V5.3c-.3 0-1.1-.1-2.1-.1-2.1 0-3.5 1.3-3.5 3.6v2.2H9v2.8h2.1V21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-linkedin" viewBox="0 0 24 24">
    <rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="7.6" cy="7.8" r="1.15" fill="currentColor"/>
    <path d="M7.6 11v6.3M11.3 17.3V13c0-1.5.9-2.3 2.1-2.3s1.9.8 1.9 2.3v4.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="grain" aria-hidden="true"></div>

<header class="bar">
  <div class="bar-mark">
    <svg class="mark-icon" viewBox="0 0 32 32"><use href="#icon-pulse"/></svg>
    <span class="mark-word">Signal</span>
  </div>
  <div class="bar-right">
    <time id="clock" class="bar-clock">--:--:--</time>
    <button id="sync" class="lever" type="button">
      <span class="lever-label">Sync now</span>
      <span class="lever-dot" aria-hidden="true"></span>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <h1 class="hero-line">Every channel.<br>One pulse.</h1>
    <p class="hero-sub" id="heroSub">Reading six channels. Connecting&#8230;</p>
  </section>

  <div class="pulse-strip" aria-hidden="true">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" class="pulse-svg">
      <path class="pulse-track" d="M0,60 L120,60 L150,20 L180,100 L210,60 L340,60 L370,35 L400,85 L430,60 L560,60 L590,10 L620,110 L650,60 L780,60 L810,30 L840,90 L870,60 L1000,60 L1030,25 L1060,95 L1090,60 L1200,60" />
      <path class="pulse-line" d="M0,60 L120,60 L150,20 L180,100 L210,60 L340,60 L370,35 L400,85 L430,60 L560,60 L590,10 L620,110 L650,60 L780,60 L810,30 L840,90 L870,60 L1000,60 L1030,25 L1060,95 L1090,60 L1200,60" />
    </svg>
    <div class="pulse-ticks">
      <span>SYNCED <b id="tickTime">--:--</b></span>
      <span id="tickTotal">— followers tracked</span>
      <span id="tickStatus">DEMO MODE</span>
    </div>
  </div>

  <section class="grid" id="grid" aria-live="polite">
    <!-- panels injected by app.js -->
  </section>
</main>

<footer class="control-strip">
  <div class="control-status" id="controlStatus"><!-- per-platform dot readout injected --></div>
  <p class="control-hint">Live reads need your own keys in <code>.env</code> — see README. This build never ships anyone's credentials.</p>
  <p class="control-copy">Signal &middot; a control room for your own channels</p>
</footer>

<script src="app.js"></script>
</body>
</html>
