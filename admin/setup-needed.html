<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal — Admin setup needed</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .setup-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 2; }
  .setup-card { max-width: 460px; background: linear-gradient(160deg, var(--bg-2), var(--bg-1)); border: 1px solid var(--line); padding: 32px 30px; }
  .setup-title { font-family: var(--display); font-weight: var(--display-weight); font-style: var(--display-style); font-size: 24px; margin: 0 0 12px; }
  .setup-body { font-size: 14px; color: var(--ink-dim); line-height: 1.6; margin: 0 0 14px; }
  .setup-body code { font-family: var(--mono); color: var(--accent-2); background: var(--bg); padding: 2px 6px; }
  .setup-back { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); text-decoration: none; }
  .setup-back:hover { color: var(--ink-dim); }
</style>
</head>
<body>
<div class="setup-shell">
  <div class="setup-card">
    <h1 class="setup-title">Admin isn't set up yet</h1>
    <p class="setup-body">Set <code>ADMIN_PASSWORD</code> (and ideally <code>SESSION_SECRET</code>) in your <code>.env</code> file, then restart the server. Until then, the admin page stays locked out — there's no default password shipped with this app.</p>
    <p class="setup-body">See <code>.env.example</code> and the README for details.</p>
    <a class="setup-back" href="/">&larr; Back to dashboard</a>
  </div>
</div>
</body>
</html>
